name: Release

# Releases a version once, when its number reaches main: publishes to npm and
# the MCP Registry, then tags it and creates the GitHub release. The tag is
# created last and marks the version as done, so a failed run can be re-run:
# the steps before it are safe to repeat.
#
# The hosted Worker is not deployed here: Cloudflare Workers Builds deploys
# every push to main.
#
# Keep this file name: npm trusted publishing is configured for publish.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag and GitHub release
      id-token: write # npm trusted publishing and MCP Registry login (OIDC)

    steps:
      - uses: actions/checkout@v4

      - name: Check for a new version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION is already released, nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js
        if: steps.version.outputs.new == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or later
      - name: Update npm
        if: steps.version.outputs.new == 'true'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.version.outputs.new == 'true'
        run: npm ci

      - name: Build
        if: steps.version.outputs.new == 'true'
        run: npm run build

      - name: Lint
        if: steps.version.outputs.new == 'true'
        run: npm run lint

      - name: Test
        if: steps.version.outputs.new == 'true'
        run: npm test

      - name: Publish to npm
        if: steps.version.outputs.new == 'true'
        run: |
          if npm view "@supadata/mcp@${{ steps.version.outputs.version }}" version > /dev/null 2>&1; then
            echo "@supadata/mcp@${{ steps.version.outputs.version }} is already on npm"
          else
            npm publish --access public
          fi

      - name: Publish to the MCP Registry
        if: steps.version.outputs.new == 'true'
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Tag and create the GitHub release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Release notes: this version's section of CHANGELOG.md
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for $VERSION" > release-notes.md
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file release-notes.md
