# Smithery configuration file: https://smithery.ai/docs/build/project-config/smithery-yaml
runtime: "typescript"
startCommand:
  type: "http"
  # JSON Schema defining the configuration options for the MCP.
  configSchema:
    type: "object"
    required:
      - "supadataApiKey"
    properties:
      supadataApiKey:
        type: "string"
        description: "Your Supadata API key."
      debug:
        type: "boolean"
        default: false
        description: "Enable debug logging"
  exampleConfig:
    supadataApiKey: "your-api-key-here"
    debug: false
