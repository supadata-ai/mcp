name = "supadata-mcp"
main = "src/worker.ts"
compatibility_date = "2024-12-01"
routes = [
  { pattern = "api.supadata.ai/mcp", zone_name = "supadata.ai" },
  { pattern = "api.supadata.ai/.well-known/oauth-authorization-server", zone_name = "supadata.ai" },
  { pattern = "api.supadata.ai/.well-known/oauth-protected-resource", zone_name = "supadata.ai" },
  { pattern = "api.supadata.ai/authorize", zone_name = "supadata.ai" },
  { pattern = "api.supadata.ai/token", zone_name = "supadata.ai" },
  { pattern = "api.supadata.ai/register", zone_name = "supadata.ai" },
  { pattern = "api.supadata.ai/callback", zone_name = "supadata.ai" },
]

[observability]
enabled = true

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "7fdecd45b4e74de2aeaf8d53cb8309af"
preview_id = "c37fddf9dc494ab99956edf0f9296cfd"
